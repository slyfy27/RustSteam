[package]
name = "rust-steam"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of Steam protocol client (port of JavaSteam)"
license = "MIT"
authors = ["Rust Steam Contributors"]
repository = "https://github.com/rust-steam/rust-steam"
readme = "README.md"
keywords = ["steam", "valve", "gaming", "protocol", "client"]
categories = ["network-programming", "api-bindings", "game-development"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"

# Networking
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }
hyper = { version = "0.14", features = ["full"] }
url = "2.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Protobuf
prost = "0.12"
prost-types = "0.12"

# Cryptography
aes = "0.6"
cbc = "0.1"
sha1 = "0.10"
sha2 = "0.9"
hmac = "0.11"
# rsa = "0.5"  # Temporarily removed to avoid OpenSSL issues
rand = "0.8"
base64 = "0.13"

# Compression
zstd = "0.11"
flate2 = "1.0"

# Utilities
uuid = { version = "0.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.0"
hex = "0.4"
byteorder = "1.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.2"

# Async streams
futures = "0.3"
futures-util = "0.3"

# JSON Web Token support
jsonwebtoken = "7.2"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[[example]]
name = "authentication"
path = "examples/authentication.rs"

[[example]]
name = "friends_list"
path = "examples/friends_list.rs"

[lib]
name = "rust_steam"
path = "src/lib.rs"
