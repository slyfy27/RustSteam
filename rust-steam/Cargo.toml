[package]
name = "rust-steam"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust implementation of the Steam protocol client"

[dependencies]
# Async runtime
tokio = { version = "1.32", features = ["full"] }
async-trait = "0.1"

# Networking
reqwest = { version = "0.11.22", features = ["json", "rustls-tls"], default-features = false }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Basic utilities
log = "0.4"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
url = "2.4"
byteorder = "1.5"
rand = "0.8"

# Basic crypto without problematic dependencies
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
