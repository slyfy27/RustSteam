[package]
name = "rust-steam"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust implementation of the Steam protocol client"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/yourusername/rust-steam"
keywords = ["steam", "protocol", "client", "gaming"]
categories = ["network-programming", "api-bindings"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Networking
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography with unified digest versions
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.21"
hex = "0.4"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
thiserror = "1.0"
rand = "0.8"

# Testing
mockall = "0.12"

[dev-dependencies]
tokio-test = "0.4"
env_logger = "0.10"

[features]
default = ["crypto"]
crypto = []
